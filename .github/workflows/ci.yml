# Pipeline de calidad (issue #20). Corre en cada push a main y en cada PR:
#   1. lint + formato (ruff)
#   2. tests unitarios e integración con cobertura mínima (pytest-cov, umbral en pyproject)
#   3. build de la imagen Docker, smoke test de /health, usuario no root y PORT configurable
#   4. escaneo de secretos en el historial (trufflehog) y vulnerabilidades
#      conocidas en las dependencias (pip-audit sobre el uv.lock)
#   5. convención de commits en PRs: tipo(#N): descripcion
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-y-tests:
    name: Lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (formato)
        run: uv run ruff format --check .
      - name: Pytest con cobertura
        run: uv run pytest

  docker:
    name: Build Docker y smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t orchestrator-service:ci .
      - name: Smoke test /health
        run: |
          docker run -d --rm --name orch -p 8000:8000 orchestrator-service:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; exit 0; fi
            sleep 1
          done
          echo "/health no respondió a tiempo"; docker logs orch; exit 1
      - name: La imagen no corre como root
        run: test "$(docker run --rm --entrypoint id orchestrator-service:ci -u)" != "0"
      - name: Arranca healthy con otro PORT
        run: |
          docker run -d --rm --name orch-port -e PORT=9000 orchestrator-service:ci
          for i in $(seq 1 30); do
            estado=$(docker inspect --format '{{.State.Health.Status}}' orch-port)
            if [ "$estado" = "healthy" ]; then exit 0; fi
            sleep 1
          done
          echo "Con PORT=9000 el contenedor no quedó healthy ($estado)"; docker logs orch-port; exit 1
      - if: always()
        run: docker stop orch orch-port || true

  secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  dependencias:
    name: Vulnerabilidades en las dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # Mismo paso que pdf-extractext: pip-audit contra la base de vulnerabilidades
      # de PyPI (OSV), sobre las versiones exactas del uv.lock y sin las de desarrollo
      # (son las que van en la imagen). Falla si alguna tiene una vulnerabilidad conocida.
      - name: pip-audit sobre las versiones exactas del uv.lock
        run: |
          uv export --no-hashes --no-dev --no-emit-project --format requirements-txt -o requirements.txt
          uvx pip-audit -r requirements.txt --no-deps --disable-pip

  commits:
    name: Convención de commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: "Verificar formato tipo(#N): descripcion"
        run: |
          pattern='^(feat|fix|docs|test|chore|refactor|ci|build|perf|style)(\(#[0-9]+\))?: .+'
          fallos=0
          while IFS= read -r msg; do
            if [[ "$msg" =~ $pattern ]]; then echo "OK   $msg"; else echo "MAL  $msg"; fallos=1; fi
          # --no-merges: en un PR, HEAD es el merge que arma GitHub ("Merge <sha> into <sha>"),
          # que no es un commit del autor y no sigue el formato.
          done < <(git log --no-merges --format=%s "origin/${{ github.base_ref }}..HEAD")
          exit $fallos
